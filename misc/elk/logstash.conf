input {
  # Réception des logs JSON via TCP
  tcp {
    port => 5044
    codec => json_lines
  }
}

output {
  # Envoi vers Elasticsearch avec index journalier
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microcrm-%{+YYYY.MM.dd}"
  }
  # Debug local (stdout)
  stdout { codec => rubydebug }
}
