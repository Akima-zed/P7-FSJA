name: Release
on:
  # Release automatique sur tag SemVer
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build artifacts and create release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Récupère le code
      - name: Checkout
        uses: actions/checkout@v4

      # Rend le wrapper Gradle exécutable (évite les erreurs de permission)
      - name: Make Gradle wrapper executable
        working-directory: back
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew

      # JDK 17 pour build back
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Build JAR backend
      - name: Build back-end JAR
        working-directory: back
        run: ./gradlew build

      # Node 20 pour build front
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      # Install front
      - name: Install front-end dependencies
        working-directory: front
        run: npm ci

      # Build front
      - name: Build front-end
        working-directory: front
        run: npm run build

      # Prépare les artefacts
      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp back/build/libs/microcrm-0.0.1-SNAPSHOT.jar release/
          cd front/dist
          tar -czf ../../release/microcrm-front-dist.tar.gz microcrm

      # Crée la release GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/microcrm-0.0.1-SNAPSHOT.jar
            release/microcrm-front-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
