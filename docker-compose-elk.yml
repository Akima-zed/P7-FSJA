version: "3.8"

services:
  elasticsearch:
    # Elasticsearch en mode single-node (démo locale)
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: es01
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      # Désactiver la sécurité pour simplifier la démo
      - xpack.security.enabled=false
    ports:
      # Port Elasticsearch
      - "9200:9200"
    networks:
      - elk

  logstash:
    # Logstash : ingestion des logs JSON depuis le back
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./misc/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      # Port d’entrée TCP JSON
      - "5044:5044"
    networks:
      - elk
    depends_on:
      - elasticsearch

  kibana:
    # Kibana : visualisation des logs
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Désactiver la sécurité pour simplifier la démo
      - xpack.security.enabled=false
    ports:
      # Port Kibana
      - "5601:5601"
    networks:
      - elk
    depends_on:
      - elasticsearch

networks:
  elk:
    driver: bridge
